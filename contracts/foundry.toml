[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
solc = "0.8.27"
evm_version = "cancun"

[dependencies]
forge-std = "1.9.5"
"@openzeppelin-contracts" = "5.2.0-rc.1"
flare-periphery = "0.1.37"

[soldeer]
remappings_generate = true
remappings_version = false
remappings_location = "txt"
recursive_deps = true

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
coston = "https://coston-api.flare.network/ext/C/rpc"
